{% extends "base.html" %}
{% block title %}Server Error — {{ app_name }}{% endblock %}
{% block page_title %}Error{% endblock %}
{% block content %}
<div class="text-center py-5 mt-5">
  <div class="display-1 fw-bold text-danger">500</div>
  <h3 class="mb-3">Something went wrong</h3>
  <p class="text-muted">An internal error occurred. It has been logged.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-2">Back to Dashboard</a>
</div>
{% endblock %}
