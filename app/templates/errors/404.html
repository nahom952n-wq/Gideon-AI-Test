{% extends "base.html" %}
{% block title %}Page Not Found — {{ app_name }}{% endblock %}
{% block page_title %}Error{% endblock %}
{% block content %}
<div class="text-center py-5 mt-5">
  <div class="display-1 fw-bold text-muted">404</div>
  <h3 class="mb-3">Page Not Found</h3>
  <p class="text-muted">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-2">Back to Dashboard</a>
</div>
{% endblock %}
