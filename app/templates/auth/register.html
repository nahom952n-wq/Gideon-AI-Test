{% extends "base.html" %}
{% block title %}Create account — ScholarMind AI{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:520px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-1">Create your ScholarMind account</h1><p class="text-muted mb-4">Your profile, chats and applications are private to your account.</p><form method="post"><div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="display_name" autocomplete="name"></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required autocomplete="email"></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required autocomplete="new-password"></div><button class="btn btn-primary w-100">Create account</button></form><p class="mt-3 mb-0 text-center">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></div></div>
{% endblock %}
