{% extends "base.html" %}
{% block title %}Sign in — ScholarMind AI{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:520px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-1">Sign in</h1><p class="text-muted mb-4">Continue to ScholarMind AI.</p><form method="post"><input type="hidden" name="next" value="{{ request.args.get('next','') }}"><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required autocomplete="email"></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required autocomplete="current-password"></div><button class="btn btn-primary w-100">Sign in</button></form><p class="mt-3 mb-0 text-center">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></div></div>
{% endblock %}
